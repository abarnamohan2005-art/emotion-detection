<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emotion Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>😊 Emotion Detection</h1>

        <p class="subtitle">
            Enter a sentence and discover its emotion
        </p>


        <form action="/predict" method="POST">

            <textarea
                name="text"
                placeholder="Type your sentence here..."
                required>{{ text if text else "" }}</textarea>


            <button type="submit">
                Detect Emotion
            </button>

        </form>


        {% if emotion %}

        <div class="result">

            <div class="emoji">
                {{ emoji }}
            </div>

            <h2>
                {{ emotion.upper() }}
            </h2>

            <p>
                Detected Emotion
            </p>

        </div>

        {% endif %}

    </div>

</body>

</html>
